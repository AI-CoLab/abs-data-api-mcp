name = "abs-data-front-door"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Public and unauthenticated, mirroring the upstream ABS API (DESIGN.md
# decision 20). Abuse is made cheap rather than blocked (decision 22): the
# catalogue is read-mostly and every upstream response is cacheable.

[[d1_databases]]
binding = "CATALOGUE"
database_name = "abs-catalogue"
# Created 2026-09-09 in region OC. Populated from data/d1/*.sql, which the
# contract generator emits from the observed catalogue each crawl.
database_id = "38885996-8b80-45a2-8f29-51268a8274a4"

[[r2_buckets]]
binding = "RAW_ARCHIVE"
bucket_name = "abs-raw-archive"

# Code Mode (decision 21): model-written JavaScript runs in fresh isolates whose
# only capability is our validated client; outbound network is blocked.
[[worker_loaders]]
binding = "LOADER"

# Daily refresh check on a rotating seventh of the flows (full sweep weekly):
# dataflow listing diff plus live-vs-observed marginals. 20:00 UTC = 06:00 AEST.
[triggers]
crons = ["0 20 * * *"]

[observability]
enabled = true

# The catalogue page is the artifact HTML, imported as text and served at
# /catalogue. On this origin the page can call the HTTP door and goes live.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
