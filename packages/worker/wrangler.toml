name = "abs-data-front-door"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Public and unauthenticated, mirroring the upstream ABS API (DESIGN.md
# decision 20). Abuse is made cheap rather than blocked (decision 22): the
# catalogue is read-mostly and every upstream response is cacheable.

[[d1_databases]]
binding = "CATALOGUE"
database_name = "abs-catalogue"
# Created 2026-09-09 in region OC. Populated from data/d1/*.sql, which the
# contract generator emits from the observed catalogue each crawl.
database_id = "38885996-8b80-45a2-8f29-51268a8274a4"

[[r2_buckets]]
binding = "RAW_ARCHIVE"
bucket_name = "abs-raw-archive"

[observability]
enabled = true
